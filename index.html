<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO ESPRESSO 24/7</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#102c60,#050713 75%);color:white;font-family:Arial,sans-serif;text-align:center;min-height:100vh}
header{padding:35px 12px 15px}
h1{font-size:clamp(36px,9vw,65px);margin:0;color:#f6ca72;letter-spacing:3px}
h2{font-size:20px;font-weight:normal;letter-spacing:5px}
.tag{color:#b8caee}
.studio{display:flex;justify-content:center;align-items:center;gap:15px;margin:40px auto 25px;max-width:580px;padding:20px;background:linear-gradient(135deg,#142952,#310d27);border:1px solid #4166aa;border-radius:24px;box-shadow:0 0 50px #1249ab55}
.deck{width:36%;aspect-ratio:1;border:7px solid #273c5b;border-radius:50%;background:repeating-radial-gradient(circle,#151923 0 4px,#080b13 5px 8px);display:grid;place-items:center;box-shadow:0 0 22px #047bff}
.deck:after{content:"ESPRESSO";font-size:10px;color:#f6ca72;background:#15214a;border-radius:50%;padding:20% 5%}
.mixer{width:20%;display:flex;justify-content:space-evenly;gap:8px}
.mixer span{height:95px;width:5px;border-radius:4px;background:linear-gradient(#fa324d,#ffcc72,#168bff)}
.player{margin:25px auto;padding:25px 15px;max-width:520px}
.live{color:#ff5269;font-weight:bold;letter-spacing:4px}
button{background:linear-gradient(90deg,#137bff,#f43456);color:white;border:0;border-radius:40px;padding:17px 35px;font-size:18px;font-weight:bold;cursor:pointer}
#status{color:#b8caee;margin:20px}
footer{color:#9baccc;font-size:13px;padding:30px}
</style>
</head>
<body>
<header>
<h1>ESPRESSO</h1>
<h2>RADIO 24/7</h2>
<p class="tag">DEEP HOUSE • FLOW • CHILLOUT • RAVE</p>
</header>
<div class="studio">
<div class="deck"></div>
<div class="mixer"><span></span><span></span><span></span></div>
<div class="deck"></div>
</div>
<div class="player">
<p class="live">● RADIO ESPRESSO</p>
<h2>MUZYKA BEZ GRANIC</h2>
<button onclick="playRadio()">▶ SŁUCHAJ RADIA</button>
<p id="status">Wkrótce start transmisji</p>
<audio id="radio"></audio>
</div>
<footer>© 2026 RADIO ESPRESSO • LECIMY!</footer>
<script>
const streamURL="http://radioespresso.duckdns.org:8000/radio.mp3";
const radio=document.getElementById("radio");
function playRadio(){
if(!streamURL){
document.getElementById("status").textContent="Czekamy na uruchomienie AzuraCast";
return;
}
radio.src=streamURL;
radio.play().catch(()=>{
document.getElementById("status").textContent="Nie udało się odtworzyć transmisji";
});
}
</script>
</body>
</html>

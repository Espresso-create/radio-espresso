#listeners.visible{display:block}

#ramowka-okno p.audycja-teraz{color:#ffe5a0;font-weight:700;text-shadow:0 0 9px rgba(255,200,85,.65)}
.audycja-teraz::after{content:"  TERAZ";font-size:10px;letter-spacing:1px;color:#ffe5a0}

<main class="app" aria-label="RADIO ESPRESSO — odtwarzacz">
  <div class="scene">
    <button class="hotspot" id="play" type="button" aria-label="Włącz radio" title="Włącz radio"></button>
    <button class="hotspot" id="pause" type="button" aria-label="Zatrzymaj radio" title="Zatrzymaj radio"></button>
    <p id="status" role="status" aria-live="polite"></p>
    
<div id="volume-control">
  <span id="volume-icon">♫</span>
  <input id="volume" type="range" min="0" max="100" value="75" aria-label="Głośność radia">
  <output id="volume-value" for="volume">75%</output>
</div>

    <p id="listeners" aria-label="Aktualna liczba słuchaczy"></p>
    
<button id="ramowka-btn" type="button" aria-label="Pokaż ramówkę radia">☷ RAMÓWKA</button>

    <button class="hotspot" id="share" type="button" aria-label="Udostępnij radio" title="Udostępnij radio"></button>
  </div>
  
<dialog id="ramowka-okno" aria-label="Ramówka RADIO ESPRESSO">
  <h2>☕ RADIO ESPRESSO</h2>
  <p class="ramowka-podtytul">NASZA RAMÓWKA 24/7</p>
 

<p id="audycja-chill">06:00–15:00 · CHILL & FLOW</p>
<p id="audycja-poezja">15:00–18:00 · GŁOSEM I SERCEM</p>
<p id="audycja-rave">18:00–22:00 · MINIMAL RAVE</p>
<p id="audycja-noc">22:00–06:00 · NIGHT CHILL</p>


<p id="audycja-noc">22:00–06:00 · NIGHT CHILL</p>


  <button id="ramowka-zamknij" type="button">ZAMKNIJ ✕</button>
</dialog>

  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
'use strict';
// Po uruchomieniu poprawnego HTTPS dla strumienia ZMIEŃ TYLKO TEN ADRES.
const STREAM_URL='https://radioespresso.duckdns.org/listen/radio_espresso_247/radio.mp3';
const PAGE_URL='https://espresso-create.github.io/radio-espresso/';
const audio=document.getElementById('audio');
  
const volumeSlider=document.getElementById('volume');
const volumeValue=document.getElementById('volume-value');

audio.volume=Number(volumeSlider.value)/100;

volumeSlider.addEventListener('input',()=>{
  const value=Number(volumeSlider.value);
  audio.volume=value/100;
  volumeValue.textContent=value+'%';
});

const playBtn=document.getElementById('play');
const pauseBtn=document.getElementById('pause');
const shareBtn=document.getElementById('share');
const statusEl=document.getElementById('status');
const listenersEl=document.getElementById('listeners');
const NOW_PLAYING_URL='https://radioespresso.duckdns.org/api/nowplaying/radio_espresso_247';
async function updateListeners(){
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000);
    let response;
    try{response=await fetch(NOW_PLAYING_URL,{cache:'no-store',signal:controller.signal});}
    finally{clearTimeout(timeout);}
    if(!response.ok)throw new Error('Błąd danych');
    const data=await response.json();
    const count=data?.listeners?.current;
    if(!Number.isInteger(count)||count<0)throw new Error('Brak danych');
    listenersEl.textContent='🎧 Teraz słucha: '+count;
    listenersEl.classList.add('visible');
  }catch(e){
    // Przy awarii API nie udajemy, że słuchaczy jest zero.
    listenersEl.classList.remove('visible');
  }
}
updateListeners();
setInterval(updateListeners,30000);

let playingStarted=false;
function status(message, isError=false){
  statusEl.textContent=message;
  statusEl.classList.toggle('show',Boolean(message));
  statusEl.classList.toggle('error',isError);
}
function update(){
  playBtn.classList.toggle('active',!audio.paused && playingStarted);
  pauseBtn.classList.toggle('active',audio.paused && playingStarted);
}
playBtn.addEventListener('click',async()=>{
  if(!audio.paused){status('Radio już gra');return;}
  status('Łączenie z radiem…');
  if(!audio.src)audio.src=STREAM_URL;
  try{await audio.play();}catch(err){
    status('Nie udało się odtworzyć radia. Spróbuj ponownie.',true);
  }
});
pauseBtn.addEventListener('click',()=>{
  audio.pause();
  status('Radio zatrzymane');
  update();
});
audio.addEventListener('playing',()=>{playingStarted=true;status('RADIO ESPRESSO — NA ŻYWO');update();});
audio.addEventListener('pause',update);
audio.addEventListener('waiting',()=>status('Łączenie z radiem…'));
audio.addEventListener('error',()=>status('Brak połączenia ze strumieniem radia.',true));
  
function aktualnaAudycja() {
  const czesci = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Berlin',
    hour: '2-digit',
    hour12: false
  }).formatToParts(new Date());

  const godzina = Number(czesci.find(c => c.type === 'hour').value);

  if (godzina >= 18 && godzina < 22) return 'MINIMAL RAVE';
  if (godzina >= 15 && godzina < 18) return 'GŁOSEM I SERCEM';
  
if (godzina >= 22 || godzina < 6) return 'NIGHT CHILL';

  return 'CHILL & FLOW';
}

function pokazAudycje() {
  if (!audio.paused && !audio.error && audio.readyState >= 2) {
    status('Teraz gramy: ' + aktualnaAudycja());
  }
}

audio.addEventListener('playing', pokazAudycje);
audio.addEventListener('pause', () => status(''));
setInterval(pokazAudycje, 30000);

shareBtn.addEventListener('click',async()=>{
  const payload={title:'RADIO ESPRESSO',text:'Posłuchaj RADIO ESPRESSO',url:PAGE_URL};
  if(navigator.share){try{await navigator.share(payload);return;}catch(e){if(e.name==='AbortError')return;}}
  try{
    await navigator.clipboard.writeText(PAGE_URL);
    status('Link do radia skopiowany');
  }catch(e){window.prompt('Skopiuj link do radia:',PAGE_URL);}
});
  
const ramowkaOkno = document.getElementById('ramowka-okno');
document.getElementById('ramowka-btn').addEventListener('click', () => {
  ramowkaOkno.showModal();
});
document.getElementById('ramowka-zamknij').addEventListener('click', () => {
  ramowkaOkno.close();
});

function oznaczAktualnaAudycje() {
  const czesci = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Berlin',
    hour: '2-digit',
    hour12: false
  }).formatToParts(new Date());

  const godzina = Number(czesci.find(c => c.type === 'hour').value);

  let aktywna;
  if (godzina >= 18 && godzina < 22) aktywna = 'audycja-rave';
  else if (godzina >= 15 && godzina < 18) aktywna = 'audycja-poezja';
  else if (godzina >= 22 || godzina < 6) aktywna = 'audycja-noc';
  else aktywna = 'audycja-chill';

  ['audycja-chill', 'audycja-rave', 'audycja-poezja', 'audycja-noc'].forEach(id => {
    document.getElementById(id).classList.toggle('audycja-teraz', id === aktywna);
  });
}

oznaczAktualnaAudycje();
setInterval(oznaczAktualnaAudycje, 30000);

</script>
